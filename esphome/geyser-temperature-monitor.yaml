esphome:
  name: geyser-temperature-monitor
  friendly_name: "Geyser Temperature Monitor"

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:

api:

ota:
  - platform: esphome

wifi:

# globals:
#   - id: temp_offset
#     type: float
#     restore_value: true
#     initial_value: "1.2"

number:
  - platform: template
    name: "Temperature Offset"
    id: temperature_offset_number
    icon: mdi:thermometer-plus
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: 1.2
    min_value: -10
    max_value: 10
    step: 0.1
    unit_of_measurement: "°C"

sensor:
  - platform: adc
    pin: GPIO36
    id: geyser_adc_raw
    attenuation: 12db
    update_interval: 60s
    filters:
      - sliding_window_moving_average:
          window_size: 5
          send_every: 5

  # Convert voltage -> NTC resistance
  # Tasmota ADCParam: 36,10000,10000,3455,0
  #   param1 = 10000  -> bridge/reference resistor (this "resistor:" value)
  #   param2 = 10000  -> NTC resistance at 25°C (reference_resistance)
  #   param3 = 3455   -> Beta coefficient (b_constant)
  - platform: resistance
    id: geyser_ntc_resistance
    sensor: geyser_adc_raw
    configuration: DOWNSTREAM   # fixed 10k resistor is ADC->GND, NTC is Vcc->ADC
    resistor: 10000ohm

  # Convert resistance -> temperature using the Beta equation
  - platform: ntc
    sensor: geyser_ntc_resistance
    name: "Geyser Temperature"
    id: geyser_temperature
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    calibration:
      b_constant: 3455
      reference_temperature: 25°C
      reference_resistance: 10000ohm
    filters:
      # applies the configurable offset above, same role as Tasmota's TempOffset
      - lambda: return x + id(temp_offset);